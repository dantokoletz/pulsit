<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Pulsit</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="cosmic-bg" aria-hidden="true"></div>
  <main id="app">
    <section id="screen-start" class="screen active">
      <img
        class="logo"
        src="assets/logo-cauquenlabs.png"
        alt="CauquenLabs"
        width="160"
        height="160"
      />
      <h1 class="title">Pulsit</h1>
      <p class="subtitle">Memoriza. Repite. Supera cada fase.</p>
      <div class="menu">
        <button id="btn-play" type="button" class="btn btn--primary">Jugar</button>
        <button id="btn-custom-open" type="button" class="btn btn--secondary">Personalizado</button>
        <button id="btn-settings-open" type="button" class="btn btn--ghost">⚙ Ajustes</button>
      </div>
    </section>

    <section id="screen-settings" class="screen">
      <h2 class="screen-title">Ajustes</h2>
      <div class="custom-form">
        <label class="field field--checkbox">
          <input id="settings-sound" type="checkbox" checked />
          <span>Sonido y vibración activados</span>
        </label>

        <label class="field field--checkbox">
          <input id="settings-colorblind" type="checkbox" />
          <span>Modo daltónico (formas además de color)</span>
        </label>

        <div class="menu">
          <button id="btn-settings-back" type="button" class="btn btn--secondary">Volver</button>
        </div>
      </div>
    </section>

    <section id="screen-custom" class="screen">
      <h2 class="screen-title">Modo personalizado</h2>
      <form id="custom-form" class="custom-form">
        <label class="field">
          <span>Cantidad de botones (3-9)</span>
          <input id="custom-buttons" type="number" min="3" max="9" required />
        </label>

        <label class="field">
          <span>Tipo de estímulo</span>
          <select id="custom-stimulus-type">
            <option value="colors">Solo colores</option>
            <option value="numbers">Solo números</option>
            <option value="both">Ambos</option>
          </select>
        </label>

        <label class="field field--checkbox">
          <input id="custom-reposition" type="checkbox" />
          <span>¿Los botones cambian de posición?</span>
        </label>

        <label class="field">
          <span>Longitud máxima de secuencia</span>
          <input id="custom-max-length" type="number" min="2" value="10" required />
        </label>

        <div class="menu">
          <button type="submit" class="btn btn--primary">Jugar</button>
          <button id="btn-custom-back" type="button" class="btn btn--secondary">Volver</button>
        </div>
      </form>
    </section>

    <section id="screen-game" class="screen">
      <header class="status-bar">
        <div class="status-bar__top">
          <span id="level-badge" class="level-badge" aria-hidden="true"></span>
          <span id="status-phase">—</span>
          <button id="btn-game-back" type="button" class="btn btn--ghost">Menú</button>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Progreso de la secuencia"
          aria-valuemin="0"
          id="progress-track"
        >
          <div class="progress-track__fill" id="progress-fill"></div>
        </div>
        <span id="status-sequence" class="progress-label">—</span>
      </header>
      <p id="game-message" class="game-message"></p>
      <div id="game-board" class="game-board"></div>
      <button id="btn-restart-level" type="button" class="restart-bar">↺ Reiniciar nivel</button>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
